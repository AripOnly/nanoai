<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List dengan Kode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-gray-50">

    <h1 class="text-2xl font-bold mb-6">Contoh Implementasi List di React</h1>

    <ul class="list-decimal list-inside space-y-4 bg-white p-6 rounded-lg shadow-md max-w-lg">
        <li>
            <span class="font-semibold text-blue-700">Membuat Komponen:</span>
            <pre class="bg-gray-800 text-white p-3 rounded mt-2 text-sm overflow-x-auto">
function MyComponent() {
  return &lt;div&gt;Halo Dunia!&lt;/div&gt;;
}</pre>
        </li>
        <li>
            <span class="font-semibold text-blue-700">Menggunakan State:</span>
            <pre class="bg-gray-800 text-white p-3 rounded mt-2 text-sm overflow-x-auto">
const [count, setCount] = useState(0);</pre>
        </li>
        <li>
            <span class="font-semibold text-blue-700">Rendering List (Mapping):</span>
            <pre class="bg-gray-800 text-white p-3 rounded mt-2 text-sm overflow-x-auto">
{items.map(item =&gt; (
  &lt;li key={item.id}&gt;{item.name}&lt;/li&gt;
))}</pre>
        </li>
    </ul>

</body>
</html>
