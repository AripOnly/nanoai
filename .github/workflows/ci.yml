name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "checkpoint/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Run tests
        run: npm test

      - name: Build web
        run: npm run build:web

      - name: Doctor
        env:
          NANO_DATA_DIR: ${{ runner.temp }}/nanoai-ci-data
          NANO_WORKSPACE: ${{ runner.temp }}/nanoai-ci-workspace
        run: npm run doctor
